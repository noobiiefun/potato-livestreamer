plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.potato.livestreamer'
    compileSdk 34

    defaultConfig {
        applicationId "com.potato.livestreamer"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        // IMPORTANT for low-end / Android Go devices (e.g. Xiaomi A3): many budget
        // phones run a 32-bit-only system image even on 64-bit-capable chips, to
        // save RAM. Explicitly keep both 32-bit and 64-bit ARM native libs so the
        // installer doesn't reject the APK with INSTALL_FAILED_NO_MATCHING_ABIS.
        // Do NOT restrict this to arm64-v8a only.
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // FFmpeg for Android — runs the actual "listen + remux to RTMP" pipeline on-device.
    // The original com.arthenica:ffmpeg-kit-* artifacts were removed from Maven
    // Central in 2025 (project retired). This uses a verified, actively
    // maintained community rebuild that still publishes multi-ABI .aar files
    // (including armeabi-v7a, needed for 32-bit Android Go devices).
    // See: https://github.com/maitrungduc1410/ffmpeg-kit
    implementation 'io.github.maitrungduc1410:ffmpeg-kit-https:8.1.2'
}
